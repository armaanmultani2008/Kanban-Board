<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form class="add-task-form">
        <input type="text" class="task-text" placeholder="Add a to do...">
        <br>
        <label for="task-priority-select" class="task-priority-label">Priority</label><br>
        <select class="task-priority-select" id="task-priority-select">
            <option class="task-priority-option" value="urgent">Urgent</option>
            <option class="task-priority-option" value="important">Important</option>
            <option class="task-priority-option" value="medium">Medium</option>
            <option class="task-priority-option" value="low">Low</option>
        </select>
        <input type="date" class="task-date" placeholder="Date of task..."><br>
        <button class="add-task-button" type="submit"></button>
    </form>
</body>
</html>
