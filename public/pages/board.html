<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <section class="board">

        <div class="colums">
            <aside class="inbox">
                <div class="column column-inbox">
                    <div class="column-title">
                        <h3>Inbox</h3>
                        <p class="tasks-num tasks-inbox-num">0</p>
                    </div>
                    <div class="tasks-inbox"></div>
                </div>
            </aside>
            <div class="column column-to-do">
                <div class="column-title">
                    <h3 data-tasks="0">To Do</h3>
                    <p class="tasks-num tasks-in-progress-num">0</p>
                </div>
                <div class="tasks tasks-to-do"></div>
            </div>
            <div class="column column-in-progress">
                <div class="column-title">
                    <h3>In Progress</h3>
                    <p class="tasks-num tasks-in-progress-num">0</p>
                </div>
                <div class="tasks tasks-in-progress"></div>
            </div>
            <div class="column column-in-review">
                <div class="column-title">
                    <h3>In Review</h3>
                    <p class="tasks-num tasks-in-review-num">0</p>
                </div>
                <div class="tasks tasks-in-review"></div>
            </div>
            <div class="column column-approved">
                <div class="column-title">
                    <h3>Approved</h3>
                    <p class="tasks-num tasks-to-do-num">0</p>
                </div>
                <div class="tasks-approved"></div>
            </div>
        </div>

    </section>
</body>
</html>
